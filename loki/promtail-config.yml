server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cowrie
    static_configs:
      - targets:
          - localhost
        labels:
          job: cowrie
          __path__: /cowrie-logs/cowrie.json*

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            eventid: eventid
            src_ip: src_ip
            username: username
            password: password
            session: session
            message: message
            input: input

      - labels:
          eventid:

      - timestamp:
          source: timestamp
          format: RFC3339Nano
